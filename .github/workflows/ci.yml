name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://si_app:ci-app@127.0.0.1:5432/scale_insyght
      DATABASE_URL_WORKER: postgresql://si_worker:ci-worker@127.0.0.1:5432/scale_insyght
      DATABASE_URL_MIGRATE: postgresql://si_migrate:ci-migrate@127.0.0.1:5432/scale_insyght
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:contracts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
