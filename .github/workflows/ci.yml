name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://si_app:ci-app@127.0.0.1:5432/scale_insyght
      DATABASE_URL_WORKER: postgresql://si_worker:ci-worker@127.0.0.1:5432/scale_insyght
      DATABASE_URL_MIGRATE: postgresql://si_migrate:ci-migrate@127.0.0.1:5432/scale_insyght
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ARTIFACT_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ARTIFACT_VOLUME_PATH: .local/artifacts
      POSTGRES_PASSWORD: ci-compose-superuser
      SI_APP_PASSWORD: ci-compose-app
      SI_WORKER_PASSWORD: ci-compose-worker
      SI_MIGRATE_PASSWORD: ci-compose-migrate
      SESSION_SECRET: ci-compose-session-secret-with-more-than-thirty-two-bytes
      CONTROL_PLANE_URL: https://control.synthetic.invalid
      GATEWAY_CREDENTIAL: synthetic-ci-gateway-credential-only
      GATEWAY_SOURCE_ID: 00000000-0000-4000-8000-000000000001
      DATABASE_URL_SAMPLE_SOURCE: postgresql://readonly:synthetic@127.0.0.1:5432/si_sample_source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject OpenAI-style credentials in working tree
        run: node scripts/secret-scan.mjs --worktree
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL 16 client tools for encrypted restore drill
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r services/sqlparse/requirements.txt
      - run: .venv/bin/python -m pip install -r services/dbt/requirements.txt
      - run: pnpm db:setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm eval:golden
      - run: pnpm test
      - run: pnpm test:sqlparse
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:contracts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build deployment images and check Compose config
        run: |
          docker compose config --quiet
          docker compose build api worker web sqlparse customer-gateway
      - name: Cold start deployment reference stack
        run: docker compose up -d --wait api web worker sqlparse
      - name: Stop deployment reference stack
        if: always()
        run: docker compose down --volumes --remove-orphans
